<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoría Digital - CEDETEC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #EFEFED;
            --primary: #003157;
            --accent: #004371;
            --text: #003157;
            --text-60: rgba(0, 49, 87, 0.60);
            --text-40: rgba(0, 49, 87, 0.40);
            --border: rgba(0, 49, 87, 0.10);
            --white: #ffffff;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.75;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 32px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .header {
            text-align: center;
            margin-bottom: 48px;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 16px;
            letter-spacing: -0.04em;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-60);
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 24px;
        }

        h1 {
            font-size: clamp(1.9rem, 5vw, 2.4rem);
            font-weight: 700;
            line-height: 1.12;
            letter-spacing: -0.025em;
            margin-bottom: 12px;
        }

        .description {
            font-size: 15px;
            color: var(--text-60);
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 32px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
            letter-spacing: 0.01em;
        }

        input[type="text"],
        input[type="tel"],
        input[type="email"],
        textarea,
        select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
            font-size: 15px;
            color: var(--text);
            background-color: var(--white);
            transition: border-color 0.15s ease;
        }

        input[type="text"]:focus,
        input[type="tel"]:focus,
        input[type="email"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 67, 113, 0.08);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        input[type="radio"] {
            width: 18px;
            height: 18px;
            margin-right: 10px;
            cursor: pointer;
            accent-color: var(--accent);
        }

        .radio-label {
            cursor: pointer;
            margin: 0;
            font-weight: 400;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 40px;
        }

        button {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: inherit;
        }

        .btn-submit {
            background-color: var(--primary);
            color: var(--white);
        }

        .btn-submit:hover {
            background-color: var(--accent);
            transform: translateY(-2px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-reset {
            background-color: transparent;
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-reset:hover {
            background-color: rgba(0, 49, 87, 0.04);
        }

        .success-message {
            display: none;
            background-color: rgba(39, 174, 96, 0.1);
            border: 1px solid rgba(39, 174, 96, 0.3);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            color: #27ae60;
            text-align: center;
            font-size: 14px;
        }

        .error-message {
            display: none;
            background-color: rgba(231, 76, 60, 0.1);
            border: 1px solid rgba(231, 76, 60, 0.3);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            color: #e74c3c;
            text-align: center;
            font-size: 14px;
        }

        .loading {
            display: none;
            text-align: center;
            font-size: 14px;
            color: var(--text-60);
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer {
            text-align: center;
            margin-top: 48px;
            font-size: 12px;
            color: var(--text-40);
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="subtitle">CEDETEC Digital</div>
            <h1>Auditoría Gratis</h1>
            <p class="description">Descubre cómo ahorrar tiempo y dinero en tu negocio</p>
        </div>

        <div class="success-message" id="successMsg">
            ✓ Gracias por completar la auditoría. Nos contactaremos pronto.
        </div>

        <div class="error-message" id="errorMsg">
            Hubo un error al enviar. Intenta de nuevo.
        </div>

        <form id="auditForm">
            <div class="form-group">
                <label for="nombre">¿Cuál es el nombre de tu negocio?</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej: Mi Almacén" required>
            </div>

            <div class="form-group">
                <label for="whatsapp">¿Cuál es tu número de WhatsApp?</label>
                <input type="tel" id="whatsapp" name="whatsapp" placeholder="Ej: +54 9 3704 123456" required>
            </div>

            <div class="form-group">
                <label for="problema">¿Cuál es tu mayor problema de tiempo o dinero?</label>
                <textarea id="problema" name="problema" placeholder="Ej: Perder horas en inventario..." required></textarea>
            </div>

            <div class="form-group">
                <label for="horas">¿Cuántas horas por semana pierdes en esto?</label>
                <input type="text" id="horas" name="horas" placeholder="Ej: 5 horas" required>
            </div>

            <div class="form-group">
                <label for="presupuesto">¿Cuál es tu presupuesto para mejorar?</label>
                <select id="presupuesto" name="presupuesto" required>
                    <option value="">Selecciona un rango</option>
                    <option value="Menos de $20k">Menos de $20k</option>
                    <option value="$20k - $50k">$20k - $50k</option>
                    <option value="$50k - $100k">$50k - $100k</option>
                    <option value="$100k - $200k">$100k - $200k</option>
                    <option value="Más de $200k">Más de $200k</option>
                </select>
            </div>

            <div class="form-group">
                <label>¿Cómo prefieres que hablemos?</label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" id="pref1" name="preferencia" value="Teléfono" required>
                        <label for="pref1" class="radio-label">Teléfono</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="pref2" name="preferencia" value="Auditoría personal en mi local">
                        <label for="pref2" class="radio-label">Auditoría personal en mi local</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="pref3" name="preferencia" value="Ambos">
                        <label for="pref3" class="radio-label">Ambos</label>
                    </div>
                </div>
            </div>

            <div class="button-group">
                <button type="reset" class="btn-reset">Limpiar</button>
                <button type="submit" class="btn-submit">Enviar Auditoría</button>
            </div>

            <div class="loading" id="loading">
                <span class="spinner"></span> Enviando...
            </div>
        </form>

        <div class="footer">
            <p>Tus datos están seguros. No compartimos información con terceros.</p>
        </div>
    </div>

    <script>
        const form = document.getElementById('auditForm');
        const successMsg = document.getElementById('successMsg');
        const errorMsg = document.getElementById('errorMsg');
        const loading = document.getElementById('loading');

        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzPZc1SSeDGZrzbUsHbvFMJoffAiL3i9BgmOE67t26wgMOmNjOp2qfQft3jet2WfSvh_A/exec';

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            successMsg.style.display = 'none';
            errorMsg.style.display = 'none';
            loading.style.display = 'block';

            const formData = new FormData(form);

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: formData,
                    mode: 'no-cors'
                });

                loading.style.display = 'none';
                successMsg.style.display = 'block';
                form.reset();

                setTimeout(() => {
                    successMsg.style.display = 'none';
                }, 5000);

            } catch (error) {
                loading.style.display = 'none';
                errorMsg.style.display = 'block';
                console.error('Error:', error);
            }
        });
    </script>
</body>
</html>
