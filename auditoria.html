<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoría Digital Gratis - CEDETEC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #003157;
            --accent: #004371;
            --bg: #EFEFED;
            --white: #ffffff;
            --text: #003157;
            --text-60: rgba(0, 49, 87, 0.60);
            --text-40: rgba(0, 49, 87, 0.40);
            --border: rgba(0, 49, 87, 0.10);
            --success: #10b981;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            color: var(--text);
            background: linear-gradient(135deg, var(--white) 0%, var(--bg) 100%);
            padding-bottom: 40px;
        }

        /* HEADER */
        header {
            background: var(--white);
            padding: 20px 32px;
            border-bottom: 1px solid var(--border);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-wrapper {
            max-width: 1080px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.04em;
            text-decoration: none;
        }

        /* MAIN CONTAINER */
        main {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 32px;
        }

        /* PROGRESS BAR */
        .progress-section {
            margin-bottom: 40px;
            position: sticky;
            top: 70px;
            background: linear-gradient(135deg, var(--white) 0%, var(--bg) 100%);
            padding: 16px 0;
            z-index: 99;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            width: 0%;
            transition: width 0.4s ease;
        }

        .progress-text {
            font-size: 14px;
            color: var(--text-40);
            text-align: right;
            font-weight: 500;
        }

        /* QUESTIONS CONTAINER */
        #questionsContainer {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* QUESTION */
        .question {
            background: var(--white);
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 4px 16px rgba(0, 49, 87, 0.08);
            opacity: 0;
            transform: translateY(20px);
            animation: slideIn 0.4s ease forwards;
        }

        @keyframes slideIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .question:nth-child(1) {
            animation-delay: 0s;
        }
        .question:nth-child(2) {
            animation-delay: 0.1s;
        }
        .question:nth-child(3) {
            animation-delay: 0.2s;
        }
        .question:nth-child(4) {
            animation-delay: 0.3s;
        }
        .question:nth-child(5) {
            animation-delay: 0.4s;
        }
        .question:nth-child(6) {
            animation-delay: 0.5s;
        }
        .question:nth-child(7) {
            animation-delay: 0.6s;
        }

        .question.completed {
            opacity: 0.7;
            background: var(--bg);
        }

        .question-number {
            font-size: 12px;
            color: var(--text-40);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .question-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 16px;
        }

        .answer-display {
            font-size: 16px;
            color: var(--text-60);
            padding: 12px;
            background: var(--bg);
            border-radius: 8px;
            margin-bottom: 16px;
            border-left: 4px solid var(--primary);
        }

        /* INPUT STYLES */
        input[type="text"],
        input[type="tel"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
            font-size: 16px;
            color: var(--text);
            background: var(--white);
            transition: all 0.3s;
            margin-bottom: 16px;
        }

        input[type="text"]:focus,
        input[type="tel"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 49, 87, 0.08);
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        /* RADIO OPTIONS */
        .radio-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .radio-option:hover {
            border-color: var(--primary);
            background: rgba(0, 49, 87, 0.02);
        }

        .radio-option input[type="radio"] {
            margin-right: 12px;
            cursor: pointer;
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
        }

        .radio-option label {
            cursor: pointer;
            flex: 1;
            font-weight: 500;
            margin: 0;
        }

        .radio-option.selected {
            border-color: var(--primary);
            background: rgba(0, 49, 87, 0.08);
        }

        /* BUTTONS */
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
        }

        .btn-submit {
            background: var(--primary);
            color: var(--white);
            padding: 14px 28px;
            font-size: 16px;
        }

        .btn-submit:hover {
            background: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 49, 87, 0.25);
        }

        .btn-edit {
            background: var(--bg);
            color: var(--primary);
            font-size: 13px;
            padding: 8px 16px;
        }

        .btn-edit:hover {
            background: var(--border);
        }

        /* ERROR MESSAGE */
        .error-message {
            color: #ef4444;
            font-size: 14px;
            margin-top: -12px;
            margin-bottom: 12px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .error-message.show {
            opacity: 1;
        }

        /* SUCCESS SCREEN */
        .success-screen {
            background: var(--white);
            border-radius: 12px;
            padding: 60px 40px;
            box-shadow: 0 4px 16px rgba(0, 49, 87, 0.08);
            text-align: center;
            display: none;
        }

        .success-screen.show {
            display: block;
            animation: slideIn 0.4s ease;
        }

        .success-icon {
            font-size: 60px;
            margin-bottom: 24px;
            animation: bounceIn 0.6s ease;
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0);
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }

        .success-title {
            font-size: 26px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 16px;
        }

        .success-text {
            font-size: 16px;
            color: var(--text-60);
            line-height: 1.8;
            margin-bottom: 32px;
        }

        .success-btn {
            display: inline-block;
            padding: 14px 40px;
            background: var(--primary);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
        }

        .success-btn:hover {
            background: var(--accent);
            transform: translateY(-2px);
        }

        /* FOOTER */
        footer {
            background: var(--white);
            border-top: 1px solid var(--border);
            padding: 24px 32px;
            text-align: center;
            font-size: 12px;
            color: var(--text-40);
            margin-top: 80px;
        }

        /* MOBILE */
        @media (max-width: 768px) {
            main {
                margin: 30px auto;
                padding: 0 24px;
            }

            .question {
                padding: 24px;
            }

            .question-title {
                font-size: 16px;
            }

            .progress-section {
                top: 60px;
                padding: 12px 0;
            }
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header>
        <div class="header-wrapper">
            <a href="index.html" class="logo">CEDETEC</a>
        </div>
    </header>

    <!-- MAIN -->
    <main>
        <!-- PROGRESS BAR -->
        <div class="progress-section">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text"><span id="progressPercent">0</span>% completado</div>
        </div>

        <!-- QUESTIONS CONTAINER -->
        <div id="questionsContainer"></div>

        <!-- SUCCESS SCREEN -->
        <div class="success-screen" id="successScreen">
            <div class="success-icon">✓</div>
            <h2 class="success-title">¡Auditoría recibida!</h2>
            <p class="success-text">Gracias por confiar en CEDETEC. Nos contactaremos contigo en breve por WhatsApp para detallar la auditoría completa.</p>
            <a href="https://wa.me/543704700739" class="success-btn">Ir a WhatsApp</a>
        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 CEDETEC. Formosa, Argentina.</p>
    </footer>

    <script>
        const questions = [
            {
                number: 1,
                title: "¿Cuál es el nombre de tu negocio?",
                type: "text",
                id: "businessName",
                placeholder: "Ej: Mi Almacén",
                required: true
            },
            {
                number: 2,
                title: "¿Cuál es tu WhatsApp?",
                type: "tel",
                id: "whatsapp",
                placeholder: "Ej: +54 9 3704 123456",
                required: true,
                validation: "phone"
            },
            {
                number: 3,
                title: "¿Cuál es tu problema principal?",
                type: "select",
                id: "mainProblem",
                options: [
                    "Pierdo tiempo en inventario manual",
                    "Gestión de turnos/citas desorganizada",
                    "No tengo control de mis gastos/ingresos",
                    "Comunicación desorganizada con clientes",
                    "Duplico trabajo entre distintos sistemas",
                    "Otro problema"
                ],
                required: true
            },
            {
                number: 4,
                title: "Cuéntanos más sobre tu situación",
                type: "textarea",
                id: "problemDetails",
                placeholder: "Opcional: Agrega detalles que creas importantes...",
                required: false
            },
            {
                number: 5,
                title: "¿Cuántas horas/semana pierdes?",
                type: "select",
                id: "hoursPerWeek",
                options: [
                    "Menos de 1 hora",
                    "1-2 horas",
                    "2-5 horas",
                    "5-10 horas",
                    "Más de 10 horas"
                ],
                required: true
            },
            {
                number: 6,
                title: "¿Cuál es tu presupuesto?",
                type: "select",
                id: "budget",
                options: [
                    "Menos de $20k",
                    "$20k - $50k",
                    "$50k - $100k",
                    "$100k - $200k",
                    "Más de $200k"
                ],
                required: true
            },
            {
                number: 7,
                title: "¿Cómo prefieres que te contactemos?",
                type: "radio",
                id: "contactPreference",
                options: [
                    "Por teléfono",
                    "Auditoría personal en mi local",
                    "Ambos"
                ],
                required: true
            }
        ];

        const formData = {};
        let currentQuestion = 0;

        function renderQuestion(index) {
            const container = document.getElementById('questionsContainer');
            const q = questions[index];

            const questionEl = document.createElement('div');
            questionEl.className = 'question';
            questionEl.dataset.index = index;

            let htmlContent = `
                <div class="question-number">Pregunta ${q.number} de ${questions.length}</div>
                <h2 class="question-title">${q.title}</h2>
            `;

            if (formData[q.id] !== undefined && formData[q.id] !== '') {
                htmlContent += `
                    <div class="answer-display">
                        <strong>Respuesta:</strong> ${formData[q.id]}
                    </div>
                    <button class="btn btn-edit" onclick="editQuestion(${index})">Editar</button>
                `;
                questionEl.classList.add('completed');
            } else {
                // Input
                if (q.type === 'text' || q.type === 'tel') {
                    htmlContent += `
                        <input type="${q.type}" id="${q.id}" placeholder="${q.placeholder}" />
                        <div class="error-message"></div>
                        <button class="btn btn-submit" onclick="answerQuestion(${index})">Siguiente</button>
                    `;
                }
                // Textarea
                else if (q.type === 'textarea') {
                    htmlContent += `
                        <textarea id="${q.id}" placeholder="${q.placeholder}"></textarea>
                        <button class="btn btn-submit" onclick="answerQuestion(${index})">Siguiente</button>
                    `;
                }
                // Select
                else if (q.type === 'select') {
                    htmlContent += `<select id="${q.id}" onchange="updateProgress()">
                        <option value="">Selecciona una opción</option>
                        ${q.options.map(opt => `<option value="${opt}">${opt}</option>`).join('')}
                    </select>
                    <div class="error-message"></div>
                    <button class="btn btn-submit" onclick="answerQuestion(${index})">Siguiente</button>`;
                }
                // Radio
                else if (q.type === 'radio') {
                    htmlContent += `
                        <div class="radio-options">
                            ${q.options.map((opt, i) => `
                                <div class="radio-option" onclick="selectRadio(this, ${index})">
                                    <input type="radio" name="contactPreference" value="${opt}" />
                                    <label>${opt}</label>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }
            }

            questionEl.innerHTML = htmlContent;
            container.appendChild(questionEl);

            if (!formData[q.id] && (q.type === 'text' || q.type === 'tel')) {
                setTimeout(() => {
                    document.getElementById(q.id).focus();
                }, 100);
            }
        }

        function renderAllQuestions() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';

            // Mostrar todas las preguntas respondidas
            questions.forEach((q, i) => {
                if (formData[q.id] !== undefined || i < currentQuestion) {
                    renderQuestion(i);
                }
            });

            // Mostrar próxima pregunta si no está respondida
            if (currentQuestion < questions.length && formData[questions[currentQuestion].id] === undefined) {
                renderQuestion(currentQuestion);
            }

            updateProgress();
        }

        function answerQuestion(index) {
            const q = questions[index];
            const input = document.getElementById(q.id);

            if (!input.value.trim() && q.required) {
                const errorDiv = document.querySelector(`[data-index="${index}"] .error-message`);
                errorDiv.textContent = 'Este campo es requerido';
                errorDiv.classList.add('show');
                return;
            }

            // Validar teléfono
            if (q.validation === 'phone') {
                const phoneRegex = /^[\d\s+().-]{9,}$/;
                if (!phoneRegex.test(input.value)) {
                    const errorDiv = document.querySelector(`[data-index="${index}"] .error-message`);
                    errorDiv.textContent = 'Por favor ingresa un teléfono válido';
                    errorDiv.classList.add('show');
                    return;
                }
            }

            formData[q.id] = input.value;
            currentQuestion = index + 1;

            if (currentQuestion < questions.length) {
                renderAllQuestions();
                window.scrollBy({ top: 300, behavior: 'smooth' });
            } else {
                showFinishForm();
            }
        }

        function selectRadio(element, index) {
            const q = questions[index];
            document.querySelectorAll(`[data-index="${index}"] .radio-option`).forEach(opt => {
                opt.classList.remove('selected');
            });
            element.classList.add('selected');
            formData[q.id] = element.querySelector('input').value;
            updateProgress();
        }

        function editQuestion(index) {
            const q = questions[index];
            delete formData[q.id];
            currentQuestion = index;
            renderAllQuestions();
            window.scrollBy({ top: 300, behavior: 'smooth' });
        }

        function showFinishForm() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = `
                <div class="question">
                    <div class="question-number">Último paso</div>
                    <h2 class="question-title">¿Todo está correcto?</h2>
                    <button class="btn btn-submit" onclick="submitForm()" style="background: var(--success);">Enviar auditoría</button>
                </div>
            `;
            window.scrollBy({ top: 400, behavior: 'smooth' });
        }

        function updateProgress() {
            const completed = Object.keys(formData).filter(key => formData[key]).length;
            const percentage = Math.round((completed / questions.length) * 100);
            document.getElementById('progressFill').style.width = percentage + '%';
            document.getElementById('progressPercent').textContent = percentage;
        }

        async function submitForm() {
            formData.timestamp = new Date().toLocaleString('es-AR');

            const GOOGLE_APPS_SCRIPT_URL = 'https://script.google.com/macros/d/1-h_BnBfG5Kno4bR6H8P4qL9R2S3T4U5V/usercontent/exec';

            try {
                await fetch(GOOGLE_APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(formData),
                    mode: 'no-cors'
                });

                document.getElementById('questionsContainer').style.display = 'none';
                document.getElementById('successScreen').classList.add('show');

            } catch (error) {
                console.error('Error:', error);
                alert('Hubo un error. Por favor intenta de nuevo.');
            }
        }

        // Iniciar
        renderAllQuestions();
        updateProgress();
    </script>
</body>
</html>
