<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoría Digital Gratis - CEDETEC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #003157;
            --accent: #004371;
            --bg: #EFEFED;
            --white: #ffffff;
            --text: #003157;
            --text-60: rgba(0, 49, 87, 0.60);
            --text-40: rgba(0, 49, 87, 0.40);
            --border: rgba(0, 49, 87, 0.10);
            --success: #10b981;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            color: var(--text);
            background: linear-gradient(135deg, var(--white) 0%, var(--bg) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        header {
            background: var(--white);
            padding: 20px 32px;
            border-bottom: 1px solid var(--border);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .header-wrapper {
            max-width: 1080px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.04em;
            text-decoration: none;
        }

        /* MAIN CONTAINER */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 32px;
        }

        .form-wrapper {
            width: 100%;
            max-width: 600px;
        }

        /* PROGRESS BAR */
        .progress-section {
            margin-bottom: 40px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            width: 0%;
            transition: width 0.4s ease;
        }

        .progress-text {
            font-size: 14px;
            color: var(--text-40);
            text-align: right;
            font-weight: 500;
        }

        /* QUESTION CONTAINER */
        .question-container {
            background: var(--white);
            border-radius: 12px;
            padding: 50px 40px;
            box-shadow: 0 8px 32px rgba(0, 49, 87, 0.1);
            min-height: 350px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            opacity: 0;
            transform: translateX(30px);
            transition: all 0.4s ease;
            pointer-events: none;
        }

        .question-container.active {
            opacity: 1;
            transform: translateX(0);
            pointer-events: all;
        }

        .question-container.exit-left {
            opacity: 0;
            transform: translateX(-30px);
        }

        .question-number {
            font-size: 12px;
            color: var(--text-40);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .question-title {
            font-size: 26px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 32px;
            line-height: 1.3;
        }

        /* INPUT STYLES */
        input[type="text"],
        input[type="tel"],
        textarea,
        select {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-family: inherit;
            font-size: 16px;
            color: var(--text);
            background: var(--white);
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        input[type="text"]:focus,
        input[type="tel"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 49, 87, 0.08);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* RADIO OPTIONS */
        .radio-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            padding: 14px;
            border: 2px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .radio-option:hover {
            border-color: var(--primary);
            background: rgba(0, 49, 87, 0.02);
        }

        .radio-option input[type="radio"] {
            margin-right: 12px;
            cursor: pointer;
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
        }

        .radio-option label {
            cursor: pointer;
            flex: 1;
            font-weight: 500;
            margin: 0;
        }

        .radio-option.selected {
            border-color: var(--primary);
            background: rgba(0, 49, 87, 0.08);
        }

        /* BUTTONS */
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 32px;
        }

        .btn {
            padding: 13px 28px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
        }

        .btn-next {
            background: var(--primary);
            color: var(--white);
        }

        .btn-next:hover {
            background: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 49, 87, 0.25);
        }

        .btn-next:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-back {
            background: var(--bg);
            color: var(--text);
            border: 2px solid var(--border);
        }

        .btn-back:hover {
            background: var(--border);
        }

        /* ERROR MESSAGE */
        .error-message {
            color: #ef4444;
            font-size: 14px;
            margin-top: -16px;
            margin-bottom: 16px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        /* SUCCESS SCREEN */
        .success-screen {
            background: var(--white);
            border-radius: 12px;
            padding: 50px 40px;
            box-shadow: 0 8px 32px rgba(0, 49, 87, 0.1);
            text-align: center;
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.4s ease;
            pointer-events: none;
        }

        .success-screen.active {
            opacity: 1;
            transform: scale(1);
            pointer-events: all;
        }

        .success-icon {
            font-size: 60px;
            margin-bottom: 24px;
            animation: bounceIn 0.6s ease;
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0);
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }

        .success-title {
            font-size: 26px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 16px;
        }

        .success-text {
            font-size: 16px;
            color: var(--text-60);
            line-height: 1.8;
            margin-bottom: 32px;
        }

        .success-btn {
            display: inline-block;
            padding: 13px 40px;
            background: var(--primary);
            color: var(--white);
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
        }

        .success-btn:hover {
            background: var(--accent);
            transform: translateY(-2px);
        }

        /* FOOTER */
        footer {
            background: var(--white);
            border-top: 1px solid var(--border);
            padding: 24px 32px;
            text-align: center;
            font-size: 12px;
            color: var(--text-40);
        }

        /* MOBILE */
        @media (max-width: 768px) {
            main {
                padding: 30px 24px;
            }

            .question-container {
                padding: 40px 24px;
                min-height: auto;
            }

            .question-title {
                font-size: 20px;
            }

            .button-group {
                flex-direction: column-reverse;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header>
        <div class="header-wrapper">
            <a href="index.html" class="logo">CEDETEC</a>
        </div>
    </header>

    <!-- MAIN -->
    <main>
        <div class="form-wrapper">
            <!-- PROGRESS BAR -->
            <div class="progress-section">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text"><span id="progressPercent">0</span>% completado</div>
            </div>

            <!-- QUESTIONS -->
            <div id="formContainer"></div>

            <!-- SUCCESS SCREEN -->
            <div class="success-screen" id="successScreen">
                <div class="success-icon">✓</div>
                <h2 class="success-title">¡Auditoría recibida!</h2>
                <p class="success-text">Gracias por confiar en CEDETEC. Nos contactaremos contigo en breve por WhatsApp para detallar la auditoría completa.</p>
                <a href="https://wa.me/543704700739" class="success-btn">Ir a WhatsApp</a>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 CEDETEC. Formosa, Argentina.</p>
    </footer>

    <script>
        const questions = [
            {
                step: 1,
                title: "¿Cuál es el nombre de tu negocio?",
                type: "text",
                id: "businessName",
                placeholder: "Ej: Mi Almacén",
                required: true
            },
            {
                step: 2,
                title: "¿Cuál es tu WhatsApp?",
                type: "tel",
                id: "whatsapp",
                placeholder: "Ej: +54 9 3704 123456",
                required: true,
                validation: "phone"
            },
            {
                step: 3,
                title: "¿Cuál es tu problema principal?",
                type: "select",
                id: "mainProblem",
                options: [
                    "Pierdo tiempo en inventario manual",
                    "Gestión de turnos/citas desorganizada",
                    "No tengo control de mis gastos/ingresos",
                    "Comunicación desorganizada con clientes",
                    "Duplico trabajo entre distintos sistemas",
                    "Otro problema"
                ],
                required: true
            },
            {
                step: 4,
                title: "Cuéntanos más sobre tu situación",
                type: "textarea",
                id: "problemDetails",
                placeholder: "Opcional: Agrega detalles que creas importantes...",
                required: false
            },
            {
                step: 5,
                title: "¿Cuántas horas/semana pierdes?",
                type: "select",
                id: "hoursPerWeek",
                options: [
                    "Menos de 1 hora",
                    "1-2 horas",
                    "2-5 horas",
                    "5-10 horas",
                    "Más de 10 horas"
                ],
                required: true
            },
            {
                step: 6,
                title: "¿Cuál es tu presupuesto?",
                type: "select",
                id: "budget",
                options: [
                    "Menos de $20k",
                    "$20k - $50k",
                    "$50k - $100k",
                    "$100k - $200k",
                    "Más de $200k"
                ],
                required: true
            },
            {
                step: 7,
                title: "¿Cómo prefieres que te contactemos?",
                type: "radio",
                id: "contactPreference",
                options: [
                    "Por teléfono",
                    "Auditoría personal en mi local",
                    "Ambos"
                ],
                required: true
            }
        ];

        const formData = {};
        let currentStep = 0;

        function renderQuestion(step) {
            const container = document.getElementById('formContainer');
            const q = questions[step];

            let htmlContent = `
                <div class="question-container active" data-step="${step}">
                    <div class="question-number">Pregunta ${q.step} de ${questions.length}</div>
                    <h2 class="question-title">${q.title}</h2>
            `;

            if (q.type === 'text' || q.type === 'tel') {
                htmlContent += `
                    <input type="${q.type}" id="${q.id}" placeholder="${q.placeholder}" />
                    <div class="error-message"></div>
                    <div class="button-group">
                        ${step > 0 ? `<button class="btn btn-back" onclick="prevStep()">Atrás</button>` : ''}
                        <button class="btn btn-next" onclick="nextStep(${step})">Siguiente</button>
                    </div>
                `;
            } else if (q.type === 'textarea') {
                htmlContent += `
                    <textarea id="${q.id}" placeholder="${q.placeholder}"></textarea>
                    <div class="button-group">
                        <button class="btn btn-back" onclick="prevStep()">Atrás</button>
                        <button class="btn btn-next" onclick="nextStep(${step})">Siguiente</button>
                    </div>
                `;
            } else if (q.type === 'select') {
                htmlContent += `
                    <select id="${q.id}" onchange="updateProgress()">
                        <option value="">Selecciona una opción</option>
                        ${q.options.map(opt => `<option value="${opt}">${opt}</option>`).join('')}
                    </select>
                    <div class="error-message"></div>
                    <div class="button-group">
                        ${step > 0 ? `<button class="btn btn-back" onclick="prevStep()">Atrás</button>` : ''}
                        <button class="btn btn-next" onclick="nextStep(${step})">Siguiente</button>
                    </div>
                `;
            } else if (q.type === 'radio') {
                htmlContent += `
                    <div class="radio-options">
                        ${q.options.map((opt, i) => `
                            <div class="radio-option" onclick="selectRadio(this, ${step})">
                                <input type="radio" name="contactPreference" value="${opt}" />
                                <label>${opt}</label>
                            </div>
                        `).join('')}
                    </div>
                    <div class="button-group">
                        <button class="btn btn-back" onclick="prevStep()">Atrás</button>
                        <button class="btn btn-next" onclick="submitForm()">Enviar auditoría</button>
                    </div>
                `;
            }

            htmlContent += `</div>`;
            container.innerHTML = htmlContent;

            if (q.type === 'text' || q.type === 'tel') {
                setTimeout(() => {
                    document.getElementById(q.id).focus();
                }, 100);
            }

            updateProgress();
        }

        function nextStep(step) {
            const q = questions[step];
            const input = document.getElementById(q.id);

            if (!input.value.trim() && q.required) {
                const errorDiv = document.querySelector('.error-message');
                errorDiv.textContent = 'Este campo es requerido';
                errorDiv.classList.add('show');
                return;
            }

            if (q.validation === 'phone') {
                const phoneRegex = /^[\d\s+().-]{9,}$/;
                if (!phoneRegex.test(input.value)) {
                    const errorDiv = document.querySelector('.error-message');
                    errorDiv.textContent = 'Por favor ingresa un teléfono válido';
                    errorDiv.classList.add('show');
                    return;
                }
            }

            formData[q.id] = input.value;
            currentStep = step + 1;

            if (currentStep < questions.length) {
                renderQuestion(currentStep);
            }
        }

        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                renderQuestion(currentStep);
            }
        }

        function selectRadio(element, step) {
            const q = questions[step];
            document.querySelectorAll('.radio-option').forEach(opt => {
                opt.classList.remove('selected');
            });
            element.classList.add('selected');
            formData[q.id] = element.querySelector('input').value;
            updateProgress();
        }

        function updateProgress() {
            const completed = Object.keys(formData).filter(key => formData[key]).length;
            const percentage = Math.round((completed / questions.length) * 100);
            document.getElementById('progressFill').style.width = percentage + '%';
            document.getElementById('progressPercent').textContent = percentage;
        }

        async function submitForm() {
            formData.timestamp = new Date().toLocaleString('es-AR');

            const GOOGLE_APPS_SCRIPT_URL = 'https://script.google.com/macros/d/1-h_BnBfG5Kno4bR6H8P4qL9R2S3T4U5V/usercontent/exec';

            try {
                await fetch(GOOGLE_APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(formData),
                    mode: 'no-cors'
                });

                document.getElementById('formContainer').style.display = 'none';
                document.getElementById('successScreen').classList.add('active');

                // Bajar el progreso suavemente
                setTimeout(() => {
                    window.scrollBy({ top: 250, behavior: 'smooth' });
                }, 200);

            } catch (error) {
                console.error('Error:', error);
                alert('Hubo un error. Por favor intenta de nuevo.');
            }
        }

        // Iniciar
        renderQuestion(0);
    </script>
</body>
</html>
